<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="45%" stop-color="#1c5bf0" />
      <stop offset="100%" stop-color="#0a369d" />
    </linearGradient>

    <!-- Chameleon Gradient (Vibrant Emerald into Electric Mint) -->
    <linearGradient id="chameleonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Eye Gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#051b4d" flood-opacity="0.45" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Lighting -->
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#bgGrad)" filter="url(#softShadow)" />

  <!-- Subtle Top Inner Lighting -->
  <rect x="20" y="20" width="472" height="236" rx="120" fill="url(#bgGrad)" opacity="0.35" />

  <!-- Chameleon Body & Spiral Tail Group -->
  <g filter="url(#glow)">
    <!-- Arched Back & Curled Spiral Tail (Continuous fluid vector) -->
    <path d="M 170 310
             C 140 310, 105 285, 105 245
             C 105 180, 160 120, 260 120
             C 340 120, 395 165, 405 220
             C 410 248, 390 270, 362 270
             C 335 270, 320 250, 315 235
             C 305 200, 275 175, 235 175
             C 190 175, 155 210, 155 250
             C 155 275, 175 295, 205 295
             C 240 295, 265 270, 265 245
             C 265 230, 250 220, 238 220
             C 225 220, 218 228, 218 235
             C 218 240, 222 244, 228 244
             C 232 244, 236 240, 236 237"
          fill="none"
          stroke="url(#chameleonGrad)"
          stroke-width="38"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Head / Snout Crown -->
    <path d="M 330 145
             C 365 130, 415 150, 425 190
             C 432 218, 415 245, 385 255"
          fill="none"
          stroke="url(#chameleonGrad)"
          stroke-width="36"
          stroke-linecap="round" />

    <!-- Expressive Chameleon Eye Outer Shell -->
    <circle cx="348" cy="188" r="38" fill="#ffffff" />
    <!-- Iris -->
    <circle cx="352" cy="188" r="24" fill="url(#eyeGrad)" />
    <!-- Pupil -->
    <circle cx="356" cy="186" r="14" fill="#0f172a" />
    <!-- Specular Reflection Highlight -->
    <circle cx="361" cy="181" r="6" fill="#ffffff" />
    <circle cx="350" cy="193" r="2.5" fill="#ffffff" opacity="0.8" />

    <!-- Friendly Crest Spikes (Speed/Energy accents) -->
    <path d="M 230 112 Q 240 92 255 110" fill="none" stroke="#4ade80" stroke-width="14" stroke-linecap="round" />
    <path d="M 275 110 Q 288 88 305 112" fill="none" stroke="#4ade80" stroke-width="14" stroke-linecap="round" />
    <path d="M 320 118 Q 335 98 350 124" fill="none" stroke="#4ade80" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>
